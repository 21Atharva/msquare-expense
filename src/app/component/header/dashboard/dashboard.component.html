<div class="container-fluid">
  <!-- Tabbed Interface -->
  <div class="tabs-container">
    <mat-tab-group mat-align-tabs="center" class="dashboard-tabs">
      
      <!-- Tab 1: Add New Expense -->
      <mat-tab label="Add New Expense">
        <div class="tab-content">
          <div class="myCard">
            <app-add-expense [tags]="keywords"></app-add-expense>
          </div>
        </div>
      </mat-tab>
      
      <!-- Tab 2: Add Category -->
      <mat-tab label="Add Category">
        <div class="tab-content">
          <div class="myCard">
            <app-add-category (categoryAdded)="handleCategory($event)"></app-add-category>
          </div>
        </div>
      </mat-tab>
      
      <!-- Tab 3: Import via CSV -->
      <mat-tab label="Import via CSV">
        <div class="tab-content">
          <div class="myCard">
            <mat-card>
              <mat-card-header>
                <mat-card-title>
                  <div>
                    <p>Import CSV Expenses</p>
                  </div>
                </mat-card-title>
              </mat-card-header>
              <mat-card-content>
                <div><p>Download <a href="https://drive.google.com/file/d/1-i_q2joBrYUqi2jYuiOmD6OeFHH9rwQL/view?usp=sharing">Sample</a> File <mat-icon style="font-size: 20px; width: 20px; height: 20px">downloading</mat-icon></p></div>
                <app-import></app-import>
              </mat-card-content>
            </mat-card>
          </div>
        </div>
      </mat-tab>
      
    </mat-tab-group>
  </div>
  
  <div>
    <button (click)="onView()" class="btns" mat-mini-fab color="accent">
      <mat-icon>equalizer</mat-icon>
    </button>
  </div>
</div>
